<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | HamperWorld</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --kitkat-red: #d1121d;
            --kitkat-dark: #8b0000;
        }

        body {
            background-color: var(--kitkat-dark);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* --- Main Success Card --- */
        .card-red-edition {
            background-color: var(--kitkat-red);
            width: 100%;
            max-width: 500px;
            border-radius: 40px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            color: white;
        }

        /* --- Pill-shaped Logo Container --- */
        .brand-pill {
            background: white;
            display: inline-block;
            padding: 8px 50px;
            border-radius: 50px;
            margin-bottom: 30px;
        }

        .brand-text {
            font-family: 'Oswald', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--kitkat-red);
            text-transform: uppercase;
            margin: 0;
        }

        .sub-message {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        /* --- Order Details Box --- */
        .order-manifest {
            background: white;
            color: var(--kitkat-red);
            border-radius: 30px;
            padding: 25px;
            text-align: left;
            margin-bottom: 30px;
        }

        .manifest-label {
            font-size: 11px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 4px;
        }

        .manifest-value {
            font-weight: 700;
            font-size: 14px;
            color: #1e293b;
            display: block;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .manifest-value:last-child { margin-bottom: 0; }

        .price-strip {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 15px;
        }

        .total-price {
            font-size: 24px;
            font-weight: 800;
            color: var(--kitkat-red);
        }

        /* --- Pill-shaped Buttons --- */
        .btn-snap-white {
            display: block;
            background: white;
            color: var(--kitkat-red);
            text-decoration: none;
            padding: 18px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s;
            margin-bottom: 15px;
        }

        .btn-snap-white:hover {
            transform: translateY(-2px);
            color: var(--kitkat-red);
        }

        .footer-link {
            color: white;
            font-size: 13px;
            text-decoration: underline;
            font-weight: 600;
            opacity: 0.8;
        }

        .footer-link:hover { opacity: 1; color: white; }
    </style>
</head>
<body>

    <div class="card-red-edition">
        <div class="brand-pill">
            <h1 class="brand-text">HAMPER WORLD</h1>
        </div>

        <p class="sub-message">Order Confirmed. Your surprise is on the way.</p>

        <div class="order-manifest">
            <span class="manifest-label">Reference ID</span>
            <span class="manifest-value">#ORD-{{ order.id }}</span>

            <span class="manifest-label">Recipient & Destination</span>
            <span class="manifest-value">
                {{ order.full_name }}<br>
                {{ order.address }}<br>   
                {{ order.city }}, {{ order.state }} - {{ order.postal_code }}<br>
                PH: {{ order.phone }}
            </span>

            <div class="price-strip">
                <span class="manifest-label" style="margin: 0;">Amount Paid</span>
                <span class="total-price">₹{{ total_amount }}</span>
            </div>
        </div>

        <a href="{% url 'hamper_list' %}" class="btn-snap-white">Continue Gifting</a>
    </div>

</body>
</html>
