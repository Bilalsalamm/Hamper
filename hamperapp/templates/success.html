<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful | Hamper Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .success-card {
            max-width: 500px;
            margin: 100px auto;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .check-icon {
            font-size: 80px;
            color: #28a745;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card success-card p-5 text-center bg-white">
            <div class="mb-4">
                <i class="bi bi-check-circle-fill check-icon"></i>
            </div>
            <h1 class="fw-bold mb-3">Thank You!</h1>
            <p class="text-muted mb-4">
                Your order for the <strong>{{ order.hamper.title }}</strong> has been placed successfully. 
                We are preparing your gift hamper for delivery!
            </p>
            
            <div class="bg-light p-3 rounded mb-4 text-start">
                <p class="small mb-1 text-uppercase text-muted fw-bold">Order Details:</p>
                <p class="mb-1"><strong>Order ID:</strong> #{{ order.id }}</p>
                <p class="mb-1"><strong>Deliver to:</strong> {{ order.full_name }}</p>
                <p class="mb-0"><strong>Status:</strong> <span class="badge bg-success">Processing</span></p>
            </div>

            <div class="d-grid gap-2">
                <a href="{% url 'hamper_list' %}" class="btn btn-primary btn-lg">Continue Shopping</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
