<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; }
        .register-card { max-width: 450px; margin-top: 50px; border: none; border-radius: 15px; }
        .btn-amazon { background: #f0c14b; border-color: #a88734; color: #111; }
        .btn-amazon:hover { background: #f4d078; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="card shadow register-card p-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Create Account</h2>
                    <p class="text-muted">Start your hamper gifting journey</p>
                </div>
                
                <form method="POST">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.help_text %}
                                <div class="form-text small">{{ field.help_text }}</div>
                            {% endif %}
                            {% for error in field.errors %}
                                <div class="text-danger small">{{ error }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    
                    <button type="submit" class="btn btn-amazon w-100 fw-bold py-2 mt-2">Sign Up</button>
                </form>

                <hr class="my-4">
                <div class="text-center">
                    <p class="mb-0">Already have an account? <a href="{% url 'login' %}" class="text-primary text-decoration-none">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
