<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resend OTP | HamperWorld</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .resend-container { 
            background: white; 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            max-width: 400px; 
            width: 100%; 
        }
        .resend-title { 
            font-weight: bold; 
            margin-bottom: 10px; 
            text-align: center; 
            color: #131921;
        }
        .resend-subtitle { 
            font-size: 13px; 
            color: #666; 
            text-align: center; 
            margin-bottom: 30px; 
        }
        .email-display {
            background: #f5f5f5;
            padding: 8px 12px;
            border-radius: 4px;
            text-align: center;
            font-size: 13px;
            margin-bottom: 20px;
            color: #333;
        }
        .btn-resend { 
            background-color: #ff9900; 
            border: none; 
            color: white; 
            font-weight: bold; 
            padding: 12px; 
            border-radius: 4px; 
            width: 100%; 
        }
        .btn-resend:hover { 
            background-color: #ff8800; 
            color: white; 
        }
        .back-link { 
            text-align: center; 
            margin-top: 20px; 
            font-size: 13px;
        }
        .back-link a { 
            color: #ff9900; 
            font-weight: bold; 
            text-decoration: none;
        }
        .back-link a:hover { 
            text-decoration: underline; 
        }
        .info-box {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="resend-container">
        <h2 class="resend-title">📤 Resend OTP</h2>
        <p class="resend-subtitle">Request a new verification code</p>
        
        <div class="email-display">
            📧 {{ email }}
        </div>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
        
        <div class="info-box">
            ✓ A new OTP will be sent to your email. Check your spam folder if you don't see it.
        </div>
        
        <form method="POST" novalidate>
            {% csrf_token %}
            <button type="submit" class="btn-resend">Send New OTP</button>
        </form>
        
        <div class="back-link">
            <p class="mb-0"><a href="{% url 'verify_otp' %}">← Back to OTP Verification</a></p>
        </div>
    </div>
</body>
</html>
