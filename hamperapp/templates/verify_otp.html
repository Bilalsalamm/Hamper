<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | HamperWorld</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .verify-container { 
            background: white; 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            max-width: 400px; 
            width: 100%; 
        }
        .verify-title { 
            font-weight: bold; 
            margin-bottom: 10px; 
            text-align: center; 
            color: #131921;
        }
        .verify-subtitle { 
            font-size: 13px; 
            color: #666; 
            text-align: center; 
            margin-bottom: 30px; 
        }
        .email-display {
            background: #f5f5f5;
            padding: 8px 12px;
            border-radius: 4px;
            text-align: center;
            font-size: 13px;
            margin-bottom: 20px;
            color: #333;
        }
        .form-control { 
            border-radius: 4px; 
            border: 1px solid #ddd; 
            padding: 12px 12px; 
            font-size: 24px;
            text-align: center;
            letter-spacing: 5px;
            font-weight: bold;
        }
        .form-control:focus { 
            border-color: #ff9900; 
            box-shadow: 0 0 0 0.2rem rgba(255, 153, 0, 0.25); 
        }
        .btn-verify { 
            background-color: #ff9900; 
            border: none; 
            color: white; 
            font-weight: bold; 
            padding: 12px; 
            border-radius: 4px; 
            width: 100%; 
            margin-top: 20px;
        }
        .btn-verify:hover { 
            background-color: #ff8800; 
            color: white; 
        }
        .resend-link { 
            text-align: center; 
            margin-top: 20px; 
            font-size: 13px;
        }
        .resend-link a { 
            color: #ff9900; 
            font-weight: bold; 
            text-decoration: none;
        }
        .resend-link a:hover { 
            text-decoration: underline; 
        }
        .help-text { 
            font-size: 12px; 
            color: #666; 
            margin-top: 10px;
            text-align: center;
        }
        .form-label { 
            font-size: 13px; 
            margin-bottom: 8px; 
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="verify-container">
        <h2 class="verify-title">🔐 Verify Your Email</h2>
        <p class="verify-subtitle">Enter the 6-digit code sent to your email</p>
        
        <div class="email-display">
            📧 {{ email }}
        </div>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
        
        <form method="POST" novalidate>
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">Enter OTP</label>
                <input 
                    type="text" 
                    name="otp" 
                    class="form-control" 
                    placeholder="000000" 
                    maxlength="6"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    required
                    autofocus
                >
            </div>
            
            <div class="help-text">
                ⏰ This code will expire in 10 minutes
            </div>
            
            <button type="submit" class="btn-verify">Verify & Activate Account</button>
        </form>
        
        <div class="resend-link">
            <p class="mb-0">Didn't receive the code? <a href="{% url 'verify_otp_resend' %}">Resend OTP</a></p>
        </div>
    </div>
    
    <script>
        // Only allow numbers in OTP input
        document.querySelector('input[name="otp"]').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
