<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Checkout | Hamper Shop</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4 order-md-2 mb-4">
                <h4 class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted">Your Cart</span>
                </h4>
                <ul class="list-group mb-3">
                    <li class="list-group-item d-flex justify-content-between lh-condensed">
                        <div>
                            <h6 class="my-0">{{ hamper.title }}</h6>
                            <small class="text-muted">Premium Gift Hamper</small>
                        </div>
                        <span class="text-muted">${{ hamper.price }}</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span>Total (USD)</span>
                        <strong>${{ hamper.price }}</strong>
                    </li>
                </ul>
            </div>

            <div class="col-md-8 order-md-1">
                <h4 class="mb-3">Shipping Address</h4>
                <form method="POST" class="needs-validation">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="full_name">Full Name</label>
                        <input type="text" class="form-control" name="full_name" required shadow>
                    </div>
                    <div class="mb-3">
                        <label for="address">Address</label>
                        <input type="text" class="form-control" name="address" placeholder="1234 Main St" required>
                    </div>
                    <div class="row">
                        <div class="col-md-5 mb-3">
                            <label for="city">City</label>
                            <input type="text" class="form-control" name="city" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="postal_code">Zip Code</label>
                            <input type="text" class="form-control" name="postal_code" required>
                        </div>
                    </div>
                    <hr class="mb-4">
                    <button class="btn btn-warning btn-lg w-100" type="submit">Place Order</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
